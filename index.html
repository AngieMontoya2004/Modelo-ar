<body>

    <div id="model-viewer-container" class="model-container">
        <model-viewer
            src="MESA_iOS.glb"
            ios-src="MESAYTABU.usdz"
            ar
            ar-modes="webxr quick-look scene-viewer" 
            camera-controls
            shadow-intensity="1">
        </model-viewer>
    </div>

    <script>
        // La detección original es buena, pero si solo te importa iOS,
        // podemos usar la misma instancia para todo, ya que 'model-viewer'
        // maneja automáticamente qué archivo usar (ios-src vs src).

        function showModel() {
            const container = document.getElementById('model-viewer-container');
            // Simplemente mostramos el contenedor. La etiqueta model-viewer
            // se encargará de seleccionar 'ios-src' o 'src' dependiendo del SO.
            container.style.display = 'block'; 
        }

        // Ejecutamos la función para que el modelo se muestre
        showModel(); 
    </script>

</body>
