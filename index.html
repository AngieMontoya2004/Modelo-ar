<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualización 3D - iPhone/iOS</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/1.12.0/model-viewer.min.js"></script>

    <style>
        body { margin: 0; padding: 0; width: 100vw; height: 100vh; }
        model-viewer { 
            width: 100%; 
            height: 100%; 
            background-color: #f0f0f0; 
            /* Se muestra por defecto */
            display: block; 
        }
    </style>
</head>
<body>

    <model-viewer
        src="MESA.glb"         ios-src="MESAYTABU.usdz"   ar
        ar-modes="quick-look"  camera-controls
        shadow-intensity="1">
    </model-viewer>

</body>
</html>
